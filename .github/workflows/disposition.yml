name: update-disposition

on:
  schedule:
    # 台北時間 平日 08:30、18:30、21:30（UTC 00:30、10:30、13:30）
    - cron: "30 0,10,13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-disposition
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch disposition data
        run: python fetch_disposition.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "update disposition data"
            git pull --rebase
            git push
          fi
